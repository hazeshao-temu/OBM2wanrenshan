<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美区秋冬上新 · 枚举词+类目树</title>
<style>

:root{--bg:#f8f9fb;--bg-card:#fff;--bg-hover:#f0f4f8;--text:#2a2f3a;--text-light:#5c6473;--text-muted:#8e97a8;--border:#e3e8ef;--accent:#1bb077;--accent-light:#eefcf5;--accent-dark:#0f704c;--shadow:0 2px 8px rgba(0,0,0,.06);--shadow-hover:0 8px 24px rgba(0,0,0,.10);--radius:12px;--radius-lg:20px}
[data-theme="dark"]{--bg:#121419;--bg-card:#1c1f27;--bg-hover:#2a2f3a;--text:#e3e8ef;--text-light:#c3cad6;--text-muted:#6c7585;--border:#2f3540;--accent:#3fc994;--accent-light:rgba(63,201,148,.1);--accent-dark:#0d593c;--shadow:0 2px 8px rgba(0,0,0,.3);--shadow-hover:0 8px 24px rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .3s,color .3s}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:3px;opacity:.4}

/* Header with TOC */
.header{position:sticky;top:0;z-index:100;background:var(--bg-card);border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
.header-top{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:16px;height:60px}
.logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:var(--text);white-space:nowrap}
.logo-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.search-box{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:7px 14px;transition:border-color .3s,box-shadow .3s}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(27,176,119,.12)}
.search-box input{flex:1;border:none;outline:none;background:transparent;color:var(--text);font-size:13px}
.search-box input::placeholder{color:var(--text-muted)}
.theme-toggle{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-light);transition:all .3s}
.theme-toggle:hover{background:var(--bg-hover)}

/* TOC bar */
.toc-bar{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto;white-space:nowrap;padding-bottom:8px}
.toc-item{padding:5px 14px;border-radius:20px;background:var(--bg);border:1px solid var(--border);color:var(--text-light);font-size:12px;cursor:pointer;transition:all .25s;white-space:nowrap;text-decoration:none}
.toc-item:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.toc-item.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Main */
.main{max-width:1280px;margin:0 auto;padding:28px 24px 80px}

/* Section */
.section{margin-bottom:48px;scroll-margin-top:120px}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid var(--border)}
.section-icon{width:36px;height:36px;border-radius:10px;background:var(--accent-light);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
[data-theme="dark"] .section-icon{color:var(--accent)}
.section-title{font-size:22px;font-weight:700;color:var(--text)}
.section-desc{font-size:13px;color:var(--text-muted);margin-left:auto}

/* Excel */
.excel-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.dim-chip{padding:5px 12px;border-radius:18px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-light);font-size:12px;cursor:pointer;transition:all .25s;white-space:nowrap}
.dim-chip:hover{border-color:var(--accent);color:var(--accent)}
.dim-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.excel-search{margin-bottom:16px}
.excel-search input{width:100%;padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-size:13px;outline:none;transition:border-color .3s}
.excel-search input:focus{border-color:var(--accent)}
.excel-table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-card);box-shadow:var(--shadow)}
.excel-table{width:100%;border-collapse:collapse;font-size:13px}
.excel-table th{background:var(--bg-hover);padding:10px 14px;text-align:left;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
.excel-table td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--text-light)}
.excel-table tr:last-child td{border-bottom:none}
.excel-table tr:hover td{background:var(--bg-hover)}
.excel-table .dim-cell{font-weight:600;color:var(--accent-dark)}
[data-theme="dark"] .excel-table .dim-cell{color:var(--accent)}
.excel-table .en-cell{color:var(--text);font-weight:500}
.excel-table .kw-cell{font-size:12px;color:var(--text-muted)}
.result-count{margin-top:10px;font-size:12px;color:var(--text-muted)}

/* Category tree */
.cat-search{margin-bottom:16px}
.cat-search input{width:100%;padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-size:13px;outline:none;transition:border-color .3s}
.cat-search input:focus{border-color:var(--accent)}
.cat-list{background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;max-height:600px;overflow-y:auto}
.cat-item{display:flex;align-items:flex-start;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border);font-size:12px;line-height:1.7;transition:background .2s}
.cat-item:last-child{border-bottom:none}
.cat-item:hover{background:var(--bg-hover)}
.cat-level{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:5px;background:var(--accent-light);color:var(--accent-dark);font-size:10px;font-weight:600;flex-shrink:0;margin-top:1px}
[data-theme="dark"] .cat-level{color:var(--accent)}
.cat-text{color:var(--text-light)}
.cat-text .hl{background:rgba(255,213,79,.35);padding:0 2px;border-radius:2px}
.cat-sep{color:var(--text-muted);margin:0 3px}
.cat-empty{padding:32px;text-align:center;color:var(--text-muted);font-size:13px}

/* PDF cards */
.pdf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pdf-card{background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .3s,transform .3s}
.pdf-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.pdf-card-img{width:100%;aspect-ratio:16/10;object-fit:cover;border-bottom:1px solid var(--border);cursor:pointer;background:var(--bg-hover)}
.pdf-card-body{padding:14px}
.pdf-card-page{display:inline-block;font-size:10px;font-weight:600;color:var(--accent-dark);background:var(--accent-light);padding:2px 8px;border-radius:10px;margin-bottom:6px}
[data-theme="dark"] .pdf-card-page{color:var(--accent)}
.pdf-card-text{font-size:12px;color:var(--text-light);line-height:1.6;max-height:120px;overflow:hidden;position:relative}
.pdf-card-text::after{content:'';position:absolute;bottom:0;left:0;right:0;height:30px;background:linear-gradient(transparent,var(--bg-card))}

/* PPT sections */
.ppt-block{background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.ppt-block-header{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--bg-hover)}
.ppt-block-title{font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
.ppt-block-slide-num{font-size:11px;color:var(--accent-dark);background:var(--accent-light);padding:1px 7px;border-radius:10px}
[data-theme="dark"] .ppt-block-slide-num{color:var(--accent)}
.ppt-block-body{padding:14px 16px}
.ppt-block-img{width:100%;border-radius:8px;border:1px solid var(--border);margin-bottom:12px;cursor:pointer}
.ppt-text-list{font-size:13px;color:var(--text-light);line-height:1.8}
.ppt-text-list li{list-style:none;margin-bottom:4px;padding-left:14px;position:relative}
.ppt-text-list li::before{content:'•';color:var(--accent);position:absolute;left:0}
.ppt-note{font-size:12px;color:var(--text-muted);font-style:italic;margin-top:6px;padding:6px 10px;background:var(--accent-light);border-radius:6px}

/* Month cards */
.month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:20px}
.month-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px;transition:border-color .3s}
.month-card:hover{border-color:var(--accent)}
.month-card-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.month-badge{font-size:14px;font-weight:700;color:var(--accent-dark);background:var(--accent-light);padding:3px 10px;border-radius:8px}
[data-theme="dark"] .month-badge{color:var(--accent)}
.month-card-title{font-size:12px;color:var(--text-light);font-weight:500}
.month-card-cats{font-size:12px;color:var(--text-muted);line-height:1.6}

/* Table from slide 15 */
.ppt-table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-card);box-shadow:var(--shadow);margin-bottom:16px}
.ppt-table{width:100%;border-collapse:collapse;font-size:12px;min-width:800px}
.ppt-table th{background:var(--bg-hover);padding:8px 10px;text-align:left;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);white-space:nowrap}
.ppt-table td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text-light);vertical-align:top;line-height:1.6}
.ppt-table tr:last-child td{border-bottom:none}
.ppt-table tr:hover td{background:var(--bg-hover)}

/* Image modal */
.img-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:200;align-items:center;justify-content:center;padding:40px}
.img-modal.active{display:flex}
.img-modal img{max-width:90%;max-height:90%;border-radius:8px}
.img-modal-close{position:fixed;top:16px;right:24px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:24px;cursor:pointer}

/* TOC sidebar (desktop) */
@media(min-width:1024px){
  .toc-sidebar{position:fixed;left:0;top:60px;bottom:0;width:220px;background:var(--bg-card);border-right:1px solid var(--border);overflow-y:auto;padding:20px 0;z-index:50}
  .toc-sidebar-title{font-size:12px;font-weight:600;color:var(--text-muted);padding:0 20px;margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
  .toc-sidebar-item{display:block;padding:8px 20px;font-size:13px;color:var(--text-light);text-decoration:none;transition:all .25s;border-left:3px solid transparent}
  .toc-sidebar-item:hover{background:var(--bg-hover);color:var(--accent)}
  .toc-sidebar-item.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-light)}
  .main{margin-left:220px}
  .header-top,.toc-bar{margin-left:220px}
}

@media(max-width:768px){
  .header-top{padding:0 16px}
  .main{padding:20px 16px 60px}
  .pdf-grid{grid-template-columns:1fr}
  .month-grid{grid-template-columns:1fr}
  .logo span{display:none}
  .section-title{font-size:18px}
}


/* Page navigation */
.page-nav-bar{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:8px;padding-bottom:8px;flex-wrap:wrap}
.page-nav-label{font-size:11px;color:var(--text-muted);white-space:nowrap}
@media(min-width:1024px){
  .page-nav-bar{margin-left:220px}
}
@media(max-width:768px){
  .page-nav-bar{padding:0 16px}
  .page-nav-label{display:none}
}
</style>

// ===== Excel =====
var currentDim="all";
function buildDimToolbar(){
  var toolbar=document.getElementById("dimToolbar");
  var dims=Object.keys(DATA.excel);
  var html='<button class="dim-chip active" onclick="selectDim(this,\x27all\x27)">全部</button>';
  dims.forEach(function(dim){
    var count=DATA.excel[dim].length;
    var safeDim=dim.replace(/'/g,"\x27");
    html+='<button class="dim-chip" onclick="selectDim(this,\x27'+safeDim+'\x27)">'+dim+' ('+count+')</button>';
  });
  toolbar.innerHTML=html;
}

function selectDim(btn,dim){
  document.querySelectorAll(".dim-chip").forEach(function(c){c.classList.remove("active")});
  btn.classList.add("active");
  currentDim=dim;
  renderExcel();
}

function renderExcel(){
  var query=document.getElementById("excelSearch").value.trim().toLowerCase();
  var tbody=document.getElementById("excelBody");
  var rows=[];
  var dims=currentDim==="all"?Object.keys(DATA.excel):[currentDim];
  dims.forEach(function(dim){
    DATA.excel[dim].forEach(function(item){
      var text=(item.dim+" "+item.sub+" "+item.cn+" "+item.en+" "+item.kw).toLowerCase();
      if(query===""||text.indexOf(query)>=0) rows.push(item);
    });
  });
  tbody.innerHTML=rows.map(function(item){
    return '<tr><td class="dim-cell">'+(item.dim||"—")+'</td><td>'+(item.sub||"—")+'</td><td>'+item.cn+'</td><td class="en-cell">'+item.en+'</td><td class="kw-cell">'+item.kw+'</td></tr>';
  }).join("");
  document.getElementById("excelCount").textContent="共 "+rows.length+" 条结果";
}

// ===== Category Tree =====
function renderCatTree(){
  var query=document.getElementById("catSearch").value.trim().toLowerCase();
  var container=document.getElementById("catList");
  var count=0;
  var html=DATA.categories.map(function(parts){
    var fullText=parts.join(" ");
    if(query===""||fullText.toLowerCase().indexOf(query)>=0){
      count++;
      var crumbs=parts.map(function(p,i){
        var dp=p;
        if(query&&p.toLowerCase().indexOf(query)>=0){
          dp=p.replace(new RegExp(escRegex(query),"gi"),function(m){return '<span class="hl">'+m+'</span>'});
        }
        return '<span class="cat-level">'+(i+1)+'</span><span class="cat-text">'+dp+'</span>';
      }).join('<span class="cat-sep">›</span>');
      return '<div class="cat-item">'+crumbs+'</div>';
    }
    return "";
  }).join("");
  if(count===0) html='<div class="cat-empty">没有找到匹配的类目，试试其他关键词？</div>';
  container.innerHTML=html;
  document.getElementById("catCount").textContent="共 "+count+" 条类目路径";
}

function escRegex(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}

// ===== PDF =====
function renderPDF(){
  var grid=document.getElementById("pdfGrid");
  var html=DATA.pdf.map(function(page){
    var img=DATA.pdfImages[String(page.page)];
    var imgHtml=img?'<img class="pdf-card-img" src="data:image/png;base64,'+img+'" onclick="openImg(\'data:image/png;base64,'+img+'\')" alt="Page '+page.page+'">':"";
    var text=page.text.substring(0,280).replace(/\n/g," ").trim();
    return '<div class="pdf-card">'+imgHtml+'<div class="pdf-card-body"><span class="pdf-card-page">第 '+page.page+' 页</span><div class="pdf-card-text">'+text+'…</div></div></div>';
  }).join("");
  grid.innerHTML=html;
}

// ===== PPT =====
function renderPPT(){
  var container=document.getElementById("pptContainer");
  var html="";
  DATA.ppt.forEach(function(sec){
    html+='<div style="margin-bottom:32px">';
    html+='<h3 style="font-size:17px;font-weight:700;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:8px"><span>'+sec.icon+'</span>'+sec.title+'</h3>';
    
    // Section 1: Month grid + table
    if(sec.id==="ppt-section1"){
      // Month cards
      html+='<div class="month-grid">';
      sec.months.forEach(function(m){
        html+='<div class="month-card"><div class="month-card-header"><span class="month-badge">'+m.month+'</span><span class="month-card-title">'+m.title+'</span></div><div class="month-card-cats">'+m.categories+'</div></div>';
      });
      html+='</div>';
      
      // Image
      if(sec.image_slide&&DATA.pptImages[sec.image_slide]){
        html+='<img class="ppt-block-img" src="data:image/png;base64,'+DATA.pptImages[sec.image_slide]+'" onclick="openImg(\'data:image/png;base64,'+DATA.pptImages[sec.image_slide]+'\')" alt="上新节奏图">';
      }
      
      // Table from slide 15
      html+='<h4 style="font-size:14px;font-weight:600;margin:16px 0 10px;color:var(--text)">核心月份备货节奏详表</h4>';
      html+='<div class="ppt-table-wrap"><table class="ppt-table"><thead><tr><th>月份</th><th>目标上架品类及厚度节点</th><th>核心面料与设计元素</th><th>区域市场与叠穿策略</th><th>开发与备货窗口期</th></tr></thead><tbody>';
      
      // Parse slide 15 table data
      var tableData=sec.table;
      for(var i=1;i<tableData.length;i++){
        var parts=tableData[i].split(" | ");
        if(parts.length>=5){
          html+='<tr>';
          html+='<td><strong>'+parts[0]+'</strong></td>';
          html+='<td>'+parts[1]+'</td>';
          html+='<td>'+parts[2]+'</td>';
          html+='<td>'+parts[3]+'</td>';
          html+='<td>'+(parts[4]||"")+'</td>';
          html+='</tr>';
        }
      }
      html+='</tbody></table></div>';
    }
    
    // Other sections: slide blocks
    if(sec.slides){
      sec.slides.forEach(function(slide){
        var img=DATA.pptImages[String(slide.num)];
        html+='<div class="ppt-block">';
        html+='<div class="ppt-block-header"><div class="ppt-block-title"><span class="ppt-block-slide-num">Slide '+slide.num+'</span></div></div>';
        html+='<div class="ppt-block-body">';
        if(img){
          html+='<img class="ppt-block-img" src="data:image/png;base64,'+img+'" onclick="openImg(\'data:image/png;base64,'+img+'\')" alt="Slide '+slide.num+'">';
        }
        html+='<ul class="ppt-text-list">';
        slide.texts.forEach(function(t){
          if(t.trim()) html+='<li>'+t.substring(0,300)+'</li>';
        });
        html+='</ul>';
        if(slide.note){
          html+='<div class="ppt-note">💡 '+slide.note+'</div>';
        }
        html+='</div></div>';
      });
    }
    
    // Section 2 & 3: also show images
    if(sec.image_slides){
      sec.image_slides.forEach(function(slideNum){
        var img=DATA.pptImages[slideNum];
        // Images are already shown inline in slide blocks, skip extra
      });
    }
    
    html+='</div>';
  });
  container.innerHTML=html;
}
